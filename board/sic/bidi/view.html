<!doctype html><meta charset=utf-8><title>HELIX full-duplex - received video</title>
<style>html,body{margin:0;height:100%;background:#000;color:#bbb;font:13px sans-serif}canvas{width:100vw;height:calc(100vh - 22px);object-fit:contain;display:block}#s{height:22px;line-height:22px;padding:0 8px}</style>
<div id=s>connecting...</div><canvas id=c width=1920 height=1080></canvas>
<script>
// Claude 2026-11-13: plays the raw H.264 (Annex B) stream of /raw with WebCodecs.  The camera stream is one slice per frame,
// SPS+PPS+SEI before every IDR (every 100 frames), so each slice NAL closes one frame.  After a decoder error (a hole in the
// received data) the decoder is reset and waits for the next IDR.
const S = document.getElementById('s'), cv = document.getElementById('c'), g = cv.getContext('2d');
let lastPost = 0, dec = null, needKey = true, ts = 0, shown = 0, errs = 0, t0 = performance.now(), last = 0, pending = [];
function hex(b) { return b.toString(16).padStart(2, '0'); }
function mkdec(sps) {
  if (dec) try { dec.close(); } catch (e) {}
  dec = new VideoDecoder({ output: f => { g.drawImage(f, 0, 0, cv.width, cv.height); f.close(); shown++; },
                           error: e => { errs++; needKey = true; dec = null; } });
  dec.configure({ codec: 'avc1.' + hex(sps[1]) + hex(sps[2]) + hex(sps[3]), optimizeForLatency: true });
}
let sps = null;
function frame(nals) {          // nals: array of Uint8Array without start codes
  let key = false;
  for (const n of nals) { const t = n[0] & 31; if (t === 7) sps = n; if (t === 5) key = true; }
  if (needKey && !key) return;
  if (!dec || dec.state === 'closed') { if (!sps) return; mkdec(sps); }
  let len = 0; for (const n of nals) len += 4 + n.length;
  const buf = new Uint8Array(len); let o = 0;
  for (const n of nals) { buf.set([0, 0, 0, 1], o); buf.set(n, o + 4); o += 4 + n.length; }
  try { dec.decode(new EncodedVideoChunk({ type: key ? 'key' : 'delta', timestamp: ts, data: buf })); ts += 33333; needKey = false; }
  catch (e) { errs++; needKey = true; dec = null; }
}
async function run() {
  if (!('VideoDecoder' in window)) { S.textContent = 'WebCodecs unavailable: open this page as http://localhost:<port>/ through an ssh tunnel (secure context needed)'; return; }
  const r = (await fetch('/raw', { cache: 'no-store' })).body.getReader();
  let buf = new Uint8Array(0);
  for (;;) {
    const { value, done } = await r.read(); if (done) break;
    const nb = new Uint8Array(buf.length + value.length); nb.set(buf); nb.set(value, buf.length); buf = nb;
    const starts = [];
    for (let i = 0; i + 3 < buf.length; i++) if (buf[i] === 0 && buf[i + 1] === 0 && buf[i + 2] === 1) { starts.push(i + 3); i += 2; }
    if (starts.length < 2) continue;
    for (let k = 0; k + 1 < starts.length; k++) {
      let e = starts[k + 1] - 3; if (e > starts[k] && buf[e - 1] === 0) e--;      // 4-byte start code
      const nal = buf.slice(starts[k], e); if (!nal.length) continue;
      pending.push(nal); const t = nal[0] & 31;
      if (t === 1 || t === 5) { frame(pending); pending = []; }
    }
    buf = buf.slice(starts[starts.length - 1] - 3);
    const now = performance.now(); if (now - last > 500) { last = now; S.textContent = `HELIX full-duplex: received video (live)   frames ${shown}   decode errors ${errs}   ${(shown / ((now - t0) / 1000)).toFixed(1)} fps avg`; 
      if (now - lastPost > 2000) { lastPost = now; fetch('/stat', { method: 'POST', body: JSON.stringify({ t: Math.round((now - t0) / 1000), frames: shown, errors: errs, w: cv.width, h: cv.height }) }).catch(() => {}); } }
  }
  S.textContent += '   (stream ended)';
}
run();
</script>
