<!doctype html><meta charset=utf-8><title>dtest</title><body><pre id=o>running</pre><script>
// Claude 2026-11-13: WebCodecs test of /raw?from=0 (120 frames from the first IDR), results POSTed to /stat
(async () => {
  const res = { ua: navigator.userAgent.replace(/.*(Chrome\/[\d.]+).*/, '$1') };
  try {
    const r = (await fetch('/raw?from=0', { cache: 'no-store' })).body.getReader(); const parts = []; let n = 0;
    while (n < 4e6) { const x = await Promise.race([r.read(), new Promise(z => setTimeout(() => z({ done: true }), 1500))]); if (x.done) break; parts.push(x.value); n += x.value.length; } r.cancel();
    const d = new Uint8Array(n); let o = 0; for (const p of parts) { d.set(p, o); o += p.length; }
    const st = []; for (let i = 0; i + 3 < d.length; i++) if (d[i] === 0 && d[i + 1] === 0 && d[i + 2] === 1) { st.push(i + 3); i += 2; }
    const nals = []; for (let k = 0; k + 1 < st.length; k++) { let e = st[k + 1] - 3; if (d[e - 1] === 0) e--; nals.push(d.slice(st[k], e)); }
    const frames = []; let cur = []; for (const x of nals) { cur.push(x); const t = x[0] & 31; if (t === 1 || t === 5) { frames.push(cur); cur = []; } }
    const k0 = frames.findIndex(f => f.some(x => (x[0] & 31) === 5)); const F = frames.slice(k0, k0 + 120); res.frames = F.length;
    async function trial(cflag, hw) {
      let outs = 0, err = null; const dec = new VideoDecoder({ output: f => { outs++; f.close(); }, error: e => { err = String(e); } });
      const setbit = (nal, pos, v) => { const r = []; for (let i = 0; i < nal.length; i++) { if (i >= 2 && nal[i] === 3 && nal[i - 1] === 0 && nal[i - 2] === 0) continue; r.push(nal[i]); }
        const B = pos >> 3, m = 0x80 >> (pos & 7); r[B] = v ? (r[B] | m) : (r[B] & ~m);
        const e = []; let z = 0; for (const b of r) { if (z >= 2 && b <= 3) { e.push(3); z = 0; } e.push(b); z = b === 0 ? z + 1 : 0; } return new Uint8Array(e); };
      const fx = x => { if ((x[0] & 31) !== 7) return x; if (cflag === 'fr0') return setbit(x, 94, 0); if (cflag === 'vsig0') return setbit(x, 90, 0); if (cflag !== null) { const y = x.slice(); y[2] = cflag; return y; } return x; };
      const sps = fx(F[0].find(x => (x[0] & 31) === 7)); const hx = b => b.toString(16).padStart(2, '0');
      dec.configure({ codec: 'avc1.' + hx(sps[1]) + hx(sps[2]) + hx(sps[3]), hardwareAcceleration: hw });
      for (let i = 0; i < F.length; i++) { const f = F[i].map(fx); let len = 0; for (const x of f) len += 4 + x.length; const b = new Uint8Array(len); let p = 0;
        for (const x of f) { b.set([0, 0, 0, 1], p); b.set(x, p + 4); p += 4 + x.length; }
        if (dec.state !== 'configured') break; try { dec.decode(new EncodedVideoChunk({ type: i === 0 ? 'key' : 'delta', timestamp: i * 40000, data: b })); } catch (e) { err = String(e); break; } }
      try { await dec.flush(); } catch (e) { err = err || String(e); }
      return `c=${cflag === null ? 'orig' : typeof cflag === 'string' ? cflag : hx(cflag)} ${hw}: outputs ${outs}/${F.length}` + (err ? ' ' + err : '');
    }
    for (const c of [null, 'fr0']) res['t' + c] = await trial(c, 'prefer-software').catch(e => 'X ' + e);
  } catch (e) { res.err = String(e); }
  await fetch('/stat', { method: 'POST', body: JSON.stringify(res) }).catch(() => {});
  document.getElementById('o').textContent = JSON.stringify(res, null, 1); document.title = 'DONE';
})();
</script>
